version: "3.9"

services:
  strategy:
    build: .
    container_name: polymarket-hl-strategy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
